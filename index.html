<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D1117;--bg2:#161B22;--bg3:#1C2333;--border:#21262D;--border2:#30363D;--text:#E6EDF3;--text2:#8B949E;--text3:#3D4D5C;--blue:#4493F8;--teal:#26A69A;--red:#F85149}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:50;background:rgba(13,17,23,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar-title{font-size:13px;font-weight:600;color:var(--text);margin-right:8px}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.btn{padding:6px 12px;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);border-radius:5px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--text)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#3384e8}
.btn.active{border-color:var(--teal);color:var(--teal)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.tb-spacer{flex:1}
.header-input{background:transparent;border:none;color:var(--text);font-size:13px;font-weight:600;font-family:inherit;outline:none;min-width:120px}
.header-input::placeholder{color:var(--text3)}
.header-input:focus{border-bottom:1px solid var(--blue)}

/* ── EDITOR ── */
#editor{padding:16px;max-width:1200px;margin:0 auto}
.row-editor{background:var(--bg2);border:1px solid var(--border);border-radius:6px;margin-bottom:12px;overflow:hidden}
.row-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.row-type-badge{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);background:#0d2020;border:1px solid #1a4040;padding:2px 8px;border-radius:3px;flex-shrink:0}
.row-section-input{flex:1;background:transparent;border:none;color:var(--text2);font-size:12px;font-family:inherit;outline:none;min-width:80px}
.row-section-input::placeholder{color:var(--text3)}
.row-section-input:focus{border-bottom:1px solid var(--border2)}
.row-btns{display:flex;gap:4px}
.icon-btn{padding:4px 8px;border:1px solid var(--border);background:transparent;color:var(--text3);border-radius:4px;cursor:pointer;font-size:12px}
.icon-btn:hover{color:var(--text2);border-color:var(--border2)}
.icon-btn.del:hover{color:var(--red);border-color:var(--red)}

.cells-grid{display:grid;gap:4px;padding:12px}

/* Cell editor */
.cell-ed{background:var(--bg3);border:1px solid var(--border);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.cell-preview{width:100%;background:#0a0f1a;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cell-preview img{width:100%;height:100%;object-fit:cover;display:none}
.cell-preview img.loaded{display:block}
.cell-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.cell-placeholder span{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3)}
.cell-inputs{padding:8px;display:flex;flex-direction:column;gap:6px}
.cell-input{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:11px;font-family:inherit;padding:5px 8px;border-radius:3px;outline:none;transition:border-color .15s}
.cell-input:focus{border-color:var(--blue);color:var(--text)}
.cell-input::placeholder{color:var(--text3)}

/* Row type layouts */
.layout-sq5{grid-template-columns:repeat(5,1fr)}
.layout-w2sq1{grid-template-columns:2fr 2fr 1fr}
.layout-w1sq3{grid-template-columns:2fr 1fr 1fr 1fr}

/* Preview aspect ratios */
.asp-sq .cell-preview{aspect-ratio:1/1}
.asp-wide .cell-preview{aspect-ratio:2/1}

/* ── ROW TYPE PICKER ── */
.picker{display:flex;gap:8px;flex-wrap:wrap}
.picker-btn{padding:8px 14px;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);border-radius:5px;cursor:pointer;font-size:12px;font-family:inherit;display:flex;align-items:center;gap:8px;transition:all .15s}
.picker-btn:hover{border-color:var(--teal);color:var(--teal)}
.layout-icon{display:flex;gap:2px;align-items:center}
.layout-icon .s{width:14px;height:14px;background:var(--border2);border-radius:1px}
.layout-icon .w{width:26px;height:14px;background:var(--border2);border-radius:1px}
.picker-btn:hover .s,.picker-btn:hover .w{background:var(--teal)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty h3{font-size:16px;margin-bottom:8px;color:var(--text2)}
.empty p{font-size:13px;margin-bottom:20px}

/* ── GALLERY ── */
#gallery{display:none;padding:4px}
.g-header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.g-name{font-size:15px;font-weight:600;color:var(--text)}
.g-links{display:flex;gap:16px}
.g-links a{font-size:13px;color:var(--text2);text-decoration:none}
.g-links a:hover{color:var(--text)}
.g-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px}
.g-label{grid-column:span 5;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);padding:10px 4px 4px}
.g-item{position:relative;overflow:hidden;border-radius:3px;cursor:pointer;background:var(--bg2)}
.g-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.g-item:hover img{transform:scale(1.04)}
.g-item-overlay{position:absolute;bottom:0;left:0;right:0;padding:20px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px;opacity:0;transition:opacity .2s}
.g-item:hover .g-item-overlay{opacity:1}
.g-sq{grid-column:span 1;aspect-ratio:1/1}
.g-wide{grid-column:span 2;aspect-ratio:2/1}
.g-footer{padding:20px;text-align:center;border-top:1px solid var(--border);margin-top:4px}
.g-footer p{font-size:13px;color:var(--text3)}
.g-footer a{color:var(--text2);text-decoration:none;margin:0 8px}
.g-footer a:hover{color:var(--text)}

/* ── LIGHTBOX ── */
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px}
#lb.on{display:flex}
#lb img{max-width:88vw;max-height:72vh;object-fit:contain;border-radius:3px}
#lb-close{position:fixed;top:16px;right:20px;background:none;border:none;color:#666;font-size:28px;cursor:pointer;line-height:1}
#lb-close:hover{color:#fff}
#lb-title{font-size:15px;font-weight:600;color:var(--text)}
#lb-desc{font-size:13px;color:var(--text2);text-align:center;max-width:500px}
#lb-nav{display:flex;gap:8px}
#lb-nav button{background:var(--bg2);border:1px solid var(--border2);color:var(--text2);padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit}
#lb-nav button:hover{color:var(--text);border-color:#8B949E}

/* ── SAVE STATUS ── */
.save-status{font-size:11px;color:var(--text3)}
.save-status.saved{color:#3FB950}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <input class="header-input" id="site-title" placeholder="Имя / заголовок сайта..." value="Mariia Filippova">
  <div class="tb-sep"></div>
  <div class="picker">
    <button class="picker-btn" onclick="addRow('sq5')">
      <div class="layout-icon"><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div></div>
      5 квадратов
    </button>
    <button class="picker-btn" onclick="addRow('w2sq1')">
      <div class="layout-icon"><div class="w"></div><div class="w"></div><div class="s"></div></div>
      ■■□
    </button>
    <button class="picker-btn" onclick="addRow('w1sq3')">
      <div class="layout-icon"><div class="w"></div><div class="s"></div><div class="s"></div><div class="s"></div></div>
      ■□□□
    </button>
  </div>
  <div class="tb-spacer"></div>
  <span class="save-status" id="save-status">Сохранено</span>
  <button class="btn" id="toggle-btn" onclick="toggleMode()">👁 Просмотр</button>
  <button class="btn primary" onclick="exportHTML()">⬇ Скачать сайт</button>
</div>

<!-- EDITOR -->
<div id="editor">
  <div id="rows-container"></div>
  <div class="empty" id="empty-state">
    <h3>Добавь первый ряд</h3>
    <p>Выбери тип ряда в верхней панели</p>
  </div>
</div>

<!-- GALLERY (preview mode) -->
<div id="gallery">
  <div class="g-header">
    <div class="g-name" id="g-title"></div>
    <div class="g-links">
      <a href="mailto:marybong13@gmail.com">Email</a>
      <a href="https://linkedin.com/in/mariia-filippova-marybong" target="_blank">LinkedIn</a>
    </div>
  </div>
  <div class="g-grid" id="g-grid"></div>
  <div class="g-footer">
    <p id="g-footer-name"></p>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lb">
  <button id="lb-close" onclick="closeLB()">×</button>
  <img id="lb-img" src="" alt="">
  <div id="lb-title"></div>
  <div id="lb-desc"></div>
  <div id="lb-nav">
    <button onclick="navLB(-1)">← Prev</button>
    <button onclick="navLB(1)">Next →</button>
  </div>
</div>

<script>
var state = {title:'Mariia Filippova', rows:[], editMode:true};
var lbItems = [], lbCur = 0;

function load(){
  var saved = localStorage.getItem('portfolio_v1');
  if(saved){ try{ state = JSON.parse(saved); }catch(e){} }
  document.getElementById('site-title').value = state.title||'';
  if(!state.editMode) state.editMode = true;
  renderEditor();
}

function save(){
  state.title = document.getElementById('site-title').value || '';
  localStorage.setItem('portfolio_v1', JSON.stringify(state));
  var s = document.getElementById('save-status');
  s.textContent = '✓ Сохранено';
  s.className = 'save-status saved';
  setTimeout(function(){s.textContent=''; s.className='save-status';}, 1500);
}

function autoSave(){ save(); }

document.getElementById('site-title').addEventListener('input', autoSave);

/* ── ROW CONFIG ── */
var ROW_TYPES = {
  sq5:  { label:'5 квадратов', cells:5, layout:'layout-sq5',  aspects:['asp-sq','asp-sq','asp-sq','asp-sq','asp-sq'] },
  w2sq1:{ label:'■■□',          cells:3, layout:'layout-w2sq1', aspects:['asp-wide','asp-wide','asp-sq'] },
  w1sq3:{ label:'■□□□',         cells:4, layout:'layout-w1sq3', aspects:['asp-wide','asp-sq','asp-sq','asp-sq'] }
};

function addRow(type){
  var cfg = ROW_TYPES[type];
  var cells = [];
  for(var i=0;i<cfg.cells;i++) cells.push({url:'',title:'',desc:''});
  var row = {id:'r'+Date.now()+Math.random(), type:type, section:'', cells:cells};
  state.rows.push(row);
  save();
  renderEditor();
}

function deleteRow(id){
  state.rows = state.rows.filter(function(r){return r.id!==id;});
  save();
  renderEditor();
}

function moveRow(id, dir){
  var idx = state.rows.findIndex(function(r){return r.id===id;});
  var newIdx = idx+dir;
  if(newIdx<0||newIdx>=state.rows.length) return;
  var tmp = state.rows[idx];
  state.rows[idx] = state.rows[newIdx];
  state.rows[newIdx] = tmp;
  save();
  renderEditor();
}

function updateCell(rowId, cellIdx, field, val){
  var row = state.rows.find(function(r){return r.id===rowId;});
  if(row) row.cells[cellIdx][field] = val;
  save();
}

function updateSection(rowId, val){
  var row = state.rows.find(function(r){return r.id===rowId;});
  if(row) row.section = val;
  save();
}

/* ── RENDER EDITOR ── */
function renderEditor(){
  var container = document.getElementById('rows-container');
  document.getElementById('empty-state').style.display = state.rows.length ? 'none' : 'block';
  container.innerHTML = '';
  state.rows.forEach(function(row){
    var cfg = ROW_TYPES[row.type];
    var el = document.createElement('div');
    el.className = 'row-editor';
    el.dataset.id = row.id;

    var cellsHTML = row.cells.map(function(cell, ci){
      return '<div class="cell-ed '+cfg.aspects[ci]+'">'
        +'<div class="cell-preview">'
        +(cell.url ? '<img src="'+esc(cell.url)+'" alt="" '
          +'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" '
          +'onload="this.classList.add(\'loaded\');this.nextElementSibling.style.display=\'none\'">' : '')
        +'<div class="cell-placeholder" style="'+(cell.url?'display:none':'')+'"><span>'+(cfg.aspects[ci]==='asp-wide'?'2:1':'1:1')+'</span></div>'
        +'</div>'
        +'<div class="cell-inputs">'
        +'<input class="cell-input" type="text" placeholder="img/filename.jpg или URL" value="'+esc(cell.url)+'" '
        +'onchange="updateCell(\''+row.id+'\','+ci+',\'url\',this.value);refreshPreview(this)">'
        +'<input class="cell-input" type="text" placeholder="Название (необязательно)" value="'+esc(cell.title)+'" '
        +'onchange="updateCell(\''+row.id+'\','+ci+',\'title\',this.value)">'
        +'<input class="cell-input" type="text" placeholder="Описание..." value="'+esc(cell.desc)+'" '
        +'onchange="updateCell(\''+row.id+'\','+ci+',\'desc\',this.value)">'
        +'</div>'
        +'</div>';
    }).join('');

    el.innerHTML = '<div class="row-head">'
      +'<span class="row-type-badge">'+cfg.label+'</span>'
      +'<input class="row-section-input" type="text" placeholder="Название секции..." value="'+esc(row.section)+'" '
      +'onchange="updateSection(\''+row.id+'\',this.value)">'
      +'<div class="row-btns">'
      +'<button class="icon-btn" onclick="moveRow(\''+row.id+'\',-1)" title="Вверх">↑</button>'
      +'<button class="icon-btn" onclick="moveRow(\''+row.id+'\',1)" title="Вниз">↓</button>'
      +'<button class="icon-btn del" onclick="deleteRow(\''+row.id+'\')" title="Удалить">✕</button>'
      +'</div>'
      +'</div>'
      +'<div class="cells-grid '+cfg.layout+'">'+cellsHTML+'</div>';

    container.appendChild(el);
  });
}

function refreshPreview(input){
  var preview = input.closest('.cell-ed').querySelector('.cell-preview');
  var img = preview.querySelector('img');
  var ph = preview.querySelector('.cell-placeholder');
  if(!img){ img = document.createElement('img'); preview.insertBefore(img,ph); }
  img.onload = function(){ img.classList.add('loaded'); ph.style.display='none'; };
  img.onerror = function(){ img.style.display='none'; ph.style.display='flex'; img.classList.remove('loaded'); };
  img.src = input.value;
}

/* ── TOGGLE MODE ── */
function toggleMode(){
  var btn = document.getElementById('toggle-btn');
  if(state.editMode){
    buildGallery();
    document.getElementById('editor').style.display = 'none';
    document.getElementById('gallery').style.display = 'block';
    btn.textContent = '✏️ Редактор';
    btn.classList.add('active');
    state.editMode = false;
  } else {
    document.getElementById('editor').style.display = 'block';
    document.getElementById('gallery').style.display = 'none';
    btn.textContent = '👁 Просмотр';
    btn.classList.remove('active');
    state.editMode = true;
  }
}

/* ── BUILD GALLERY ── */
function buildGallery(){
  var t = state.title || 'Portfolio';
  document.getElementById('g-title').textContent = t;
  document.getElementById('g-footer-name').textContent = t;

  var grid = document.getElementById('g-grid');
  grid.innerHTML = '';
  lbItems = [];

  var ROW_SPANS = {
    sq5:  ['g-sq','g-sq','g-sq','g-sq','g-sq'],
    w2sq1:['g-wide','g-wide','g-sq'],
    w1sq3:['g-wide','g-sq','g-sq','g-sq']
  };

  state.rows.forEach(function(row){
    if(row.section){
      var lbl = document.createElement('div');
      lbl.className = 'g-label';
      lbl.textContent = row.section;
      grid.appendChild(lbl);
    }
    var spans = ROW_SPANS[row.type];
    row.cells.forEach(function(cell, ci){
      var item = document.createElement('div');
      item.className = 'g-item '+spans[ci];
      var idx = lbItems.length;
      if(cell.url){
        item.innerHTML = '<img src="'+esc(cell.url)+'" alt="'+esc(cell.title)+'">'
          +'<div class="g-item-overlay">'+esc(cell.title||'')+'</div>';
        item.addEventListener('click', function(){ openLB(idx); });
        lbItems.push(cell);
      } else {
        item.style.background = '#0a0f1a';
        lbItems.push(null);
      }
      grid.appendChild(item);
    });
  });
}

/* ── LIGHTBOX ── */
function openLB(idx){
  while(idx < lbItems.length && !lbItems[idx]) idx++;
  if(idx >= lbItems.length) return;
  lbCur = idx;
  var c = lbItems[lbCur];
  document.getElementById('lb-img').src = c.url;
  document.getElementById('lb-title').textContent = c.title||'';
  document.getElementById('lb-desc').textContent = c.desc||'';
  document.getElementById('lb').classList.add('on');
}
function closeLB(){ document.getElementById('lb').classList.remove('on'); }
function navLB(d){
  var idx = lbCur+d;
  while(idx>=0 && idx<lbItems.length && !lbItems[idx]) idx+=d;
  if(idx>=0 && idx<lbItems.length) openLB(idx);
}
document.getElementById('lb').addEventListener('click',function(e){if(e.target===this)closeLB();});
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lb').classList.contains('on'))return;
  if(e.key==='Escape')closeLB();
  if(e.key==='ArrowLeft')navLB(-1);
  if(e.key==='ArrowRight')navLB(1);
});

/* ── EXPORT ── */
function exportHTML(){
  var t = state.title||'Portfolio';
  var ROW_SPANS2 = {
    sq5:  ['g-sq','g-sq','g-sq','g-sq','g-sq'],
    w2sq1:['g-wide','g-wide','g-sq'],
    w1sq3:['g-wide','g-sq','g-sq','g-sq']
  };

  var items = [];
  var gridHTML = '';
  state.rows.forEach(function(row){
    if(row.section) gridHTML += '<div class="g-label">'+esc(row.section)+'</div>\n';
    var spans = ROW_SPANS2[row.type];
    row.cells.forEach(function(cell,ci){
      var idx = items.length;
      gridHTML += '<div class="g-item '+spans[ci]+'" onclick="openLB('+idx+')">'
        +(cell.url?'<img src="'+esc(cell.url)+'" alt="'+esc(cell.title)+'" loading="lazy">':'')
        +(cell.title?'<div class="g-overlay">'+esc(cell.title)+'</div>':'')
        +'</div>\n';
      items.push(cell);
    });
  });

  var itemsJson = JSON.stringify(items);

  var html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<script>
var items=${itemsJson};
var cur=0;
function openLB(i){cur=i;var c=items[i];if(!c||!c.url)return;document.getElementById('lb-img').src=c.url;document.getElementById('lb-title').textContent=c.title||'';document.getElementById('lb-desc').textContent=c.desc||'';document.getElementById('lb').classList.add('on');}
function closeLB(){document.getElementById('lb').classList.remove('on');}
function navLB(d){var i=cur+d;while(i>=0&&i<items.length&&(!items[i]||!items[i].url))i+=d;if(i>=0&&i<items.length)openLB(i);}
document.getElementById('lb').addEventListener('click',function(e){if(e.target===this)closeLB();});
document.addEventListener('keydown',function(e){if(!document.getElementById('lb').classList.contains('on'))return;if(e.key==='Escape')closeLB();if(e.key==='ArrowLeft')navLB(-1);if(e.key==='ArrowRight')navLB(1);});
<\/script>
